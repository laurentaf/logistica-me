version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: logistica-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRES_DB: ${POSTGRES_DBNAME:-logistica_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DBNAME:-logistica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistica-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe123!}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-logistica_db}
      API_KEY_DATASET: ${API_KEY_DATASET}
      API_KEY_NVIDIA: ${API_KEY_NVIDIA}
      API_KEY_OPENROUTER: ${API_KEY_OPENROUTER}
      PROJECT_ID: ${PROJECT_ID}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./dashboard:/app/dashboard
    command: >
      sh -c "
        echo '=== Running full pipeline ===' &&
        python API.py --count 1 &&
        python data_processing_pipeline.py &&
        python incremental_dbt_seed.py &&
        cd logistica_dbt && dbt deps --profiles-dir . && dbt seed --profiles-dir . && dbt run --profiles-dir . && cd .. &&
        echo '=== Exporting Power BI dataset ===' &&
        python export_powerbi_dataset.py &&
        echo '=== Pipeline complete. CSVs in data/powerbi/ ==='
      "
volumes:
  postgres-data:
